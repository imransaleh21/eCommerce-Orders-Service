services:
   orders-api-container:
    image: imran88/ecommerce-orders-microservice:v1.1
    build:
      context: .
      dockerfile: eCommerceSolution.API/Dockerfile
    container_name: orders-api-container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - MONGO_HOST=mongodb-container
      - MONGO_PORT=27017
      - MONGO_DATABASE=OrdersDatabase
      - REDIS_HOST=redis-container
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq-container
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=guest123
    ports:
      - "8070:8080"
    depends_on:
      - mongodb-container
      - redis-container
      - rabbitmq-container
    networks:
      - ecommerce-network
    
   products-api-container:
    image: imran88/ecommerce-products-microservice:v1.0
    container_name: products-api-container
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - MYSQL_HOST=mysql-db-container
        - MYSQL_PORT=3306
        - MYSQL_USER=root
        - MYSQL_PASS=mysql
        - MYSQL_DATABASE=eCommerceProducts
        - RABBITMQ_HOST=rabbitmq-container
        - RABBITMQ_PORT=5672
        - RABBITMQ_USER=user
        - RABBITMQ_PASS=guest123
    ports:
        - "6060:8080"
    depends_on:
        - mysql-db-container
        - rabbitmq-container
    networks:
        - ecommerce-network

   users-api-container:
    image: imran88/ecommerce-users-microservice:v1.2
    container_name: users-api-container
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - POSTGRES_HOST=postgresql-db-container
        - POSTGRES_PORT=5432
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=eCommerceUsers
    ports:
        - "5050:8080"
    depends_on:
        - postgresql-db-container
    networks:
        - ecommerce-network
    
   mongodb-container:
        image: mongo:latest
        container_name: mongodb-container
        ports:
            - "27017:27017"
        volumes:
            - ./init.js:/docker-entrypoint-initdb.d/init.js
        networks:
            - ecommerce-network
        hostname: mongodb-container

   mysql-db-container:
      image: mysql:latest
      container_name: mysql-db-container
      environment:
          MYSQL_ROOT_PASSWORD: mysql
      ports:
          - "3306:3306"
      volumes:
          - ../eCommerce-Products-Service/db.sql:/docker-entrypoint-initdb.d/db.sql
      networks:
          - ecommerce-network
      hostname: mysql-db-container

   postgresql-db-container:
        image: postgres:latest
        container_name: postgresql-db-container
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_DB: eCommerceUsers
        ports:
            - "5432:5432"
        volumes:
            - ../eCommerce-Users-Service:/docker-entrypoint-initdb.d
        networks:
            - ecommerce-network
        hostname: postgresql-db-container
   
   redis-container:
        image: redis:latest
        container_name: redis-container
        ports:
            - "6379:6379"
        volumes:
            -  F:/eCommerce-Microservices/redis-cache:/data
        networks:
            - ecommerce-network
        hostname: redis-container

   api-gateway-container:
        image: imran88/ecommerce-api-gateway:v1.0
        container_name: api-gateway-container
        build:
            context: .
            dockerfile: ApiGateway/Dockerfile
        ports:
            - "5001:8080"
        depends_on:
            - orders-api-container
            - products-api-container
            - users-api-container
        networks:
            - ecommerce-network

   rabbitmq-container:
        image: rabbitmq:management
        container_name: rabbitmq-container
        ports:
            - "15672:15672"
            - "5672:5672"
        environment:
            RABBITMQ_DEFAULT_USER: user
            RABBITMQ_DEFAULT_PASS: guest123
        networks:
            - ecommerce-network
        hostname: rabbitmq-container

networks:
    ecommerce-network:
        driver: bridge
